# App iOS (Capacitor) compilada en un Mac de GitHub, sin necesidad de tener Mac.
# Genera un .ipa SIN FIRMAR como artefacto descargable. Para instalarlo en el iPhone
# hay que firmarlo (Sideloadly/AltStore con un Apple ID) — ver README, sección «App iOS».
name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Seleccionar Xcode 26 (lo exige Capacitor 8)
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync ios

      - name: Compilar (sin firma)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry CentroFamiliar-sin-firmar.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CentroFamiliar-ipa
          path: CentroFamiliar-sin-firmar.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
